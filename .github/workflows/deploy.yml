name: Deploy Static Website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  # Runs on PRs only. Validates the CloudFormation template and previews
  # the S3 sync without changing anything, so it can be used as a required
  # status check before merging.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for the read-only validate role
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_VALIDATE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Lint CloudFormation template
        run: |
          pip install --quiet cfn-lint
          # W3045 (redundant AccessControl) is intentionally suppressed:
          # removing it breaks `cloudformation deploy` updates on this
          # bucket once OwnershipControls: BucketOwnerEnforced is set,
          # even though a fresh create works fine without it. See the
          # comment on CloudFrontBucket's AccessControl property.
          #
          # W1031 (Fn::Sub doesn't match the ARN pattern) is also
          # suppressed: WebsiteReplicaBucketArn/ImagesReplicaBucketArn
          # default to '' so the template stays deployable with
          # replication off, and cfn-lint statically checks that empty
          # default against the ARN regex rather than a real deploy-time
          # value. The Rules: section's assertions already enforce that
          # these are set to real ARNs whenever EnableCrossRegionReplication
          # is 'true'.
          cfn-lint s3-static-website.yaml --ignore-checks W3045,W1031
          cfn-lint s3-static-website-dr.yaml

      - name: Preview S3 sync (dry run)
        run: |
          aws s3 sync ./s3-static-website "s3://${{ vars.S3_BUCKET_NAME }}/" --delete --dryrun
          aws s3 sync ./product-images "s3://${{ vars.IMAGES_BUCKET_NAME }}/" --delete --dryrun

  # Runs only after a push lands on main (i.e. after a PR merges).
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The deploy role trusts only jobs in this environment, and the
    # environment only allows the main branch.
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC token for the deploy role
    # Prevent two pushes from racing to sync/invalidate at the same time.
    concurrency:
      group: deploy-website
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Assumes GitHubActionsDeployRole via OIDC — no long-lived AWS
      # credentials are stored in GitHub. The role's trust policy only
      # allows jobs in this repo's production environment to assume it.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # --delete keeps the bucket an exact mirror of ./s3-static-website,
      # removing any objects that no longer exist in the repo.
      - name: Sync website files to S3
        run: |
          aws s3 sync ./s3-static-website "s3://${{ vars.S3_BUCKET_NAME }}/" --delete

      # product-images/images/... mirrors the /images/* URL path exactly,
      # so it lands in the images bucket at the same key CloudFront
      # requests (see the ImagesBucket comment in s3-static-website.yaml).
      - name: Sync product images to S3
        run: |
          aws s3 sync ./product-images "s3://${{ vars.IMAGES_BUCKET_NAME }}/" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
