name: Deploy Static Website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  # Runs on PRs only. Validates the CloudFormation template and previews
  # the S3 sync without changing anything, so it can be used as a required
  # status check before merging.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # TEMPORARY: prints the OIDC token's actual claims to diagnose an
      # AssumeRoleWithWebIdentity failure. Remove once the trust policy
      # is confirmed to match. Safe to print: this is a short-lived ID
      # token scoped to sts.amazonaws.com, not a credential itself.
      - name: Debug OIDC claims
        run: |
          export TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          python3 -c "
          import base64, json, os
          payload = os.environ['TOKEN'].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(payload)), indent=2))
          "

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Lint CloudFormation template
        run: |
          pip install --quiet cfn-lint
          cfn-lint s3-static-website.yaml

      - name: Preview S3 sync (dry run)
        run: |
          aws s3 sync ./s3-static-website "s3://${{ vars.S3_BUCKET_NAME }}/" --delete --dryrun

  # Runs only after a push lands on main (i.e. after a PR merges).
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Prevent two pushes from racing to sync/invalidate at the same time.
    concurrency:
      group: deploy-website
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Assumes GitHubActionsDeployRole via OIDC — no long-lived AWS
      # credentials are stored in GitHub. The role's trust policy only
      # allows this repo's main branch to assume it.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # --delete keeps the bucket an exact mirror of ./s3-static-website,
      # removing any objects that no longer exist in the repo.
      - name: Sync website files to S3
        run: |
          aws s3 sync ./s3-static-website "s3://${{ vars.S3_BUCKET_NAME }}/" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
