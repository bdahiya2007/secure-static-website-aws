name: Deploy Static Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

# Prevent two pushes from racing to sync/invalidate at the same time.
concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Assumes GitHubActionsDeployRole via OIDC — no long-lived AWS
      # credentials are stored in GitHub. The role's trust policy only
      # allows this repo's main branch to assume it.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # --delete keeps the bucket an exact mirror of ./s3-static-website,
      # removing any objects that no longer exist in the repo.
      - name: Sync website files to S3
        run: |
          aws s3 sync ./s3-static-website "s3://${{ vars.S3_BUCKET_NAME }}/" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
