AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an S3 bucket configured for static website hosting, fronted by a
  CloudFront distribution using Origin Access Control (OAC), protected by
  an AWS WAF web ACL with the AWS managed SQL injection rule set. A second,
  dedicated S3 bucket stores product images and is served from the same
  CloudFront distribution as an additional origin, routed via the
  /images/* path pattern and secured with its own OAC. Both buckets block
  all public access; content is only reachable through CloudFront. NOTE:
  because the WAF web ACL is scoped to CloudFront, this stack must be
  deployed in the us-east-1 (N. Virginia) region — that is an AWS WAF
  requirement for CloudFront-scoped web ACLs, regardless of which region
  your users or other resources are in.

Parameters:
  BucketName:
    Type: String
    Description: >
      Globally unique name for the S3 bucket (must be lowercase, no
      underscores, and follow S3 bucket naming rules).
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: >
      Must be a valid S3 bucket name: lowercase letters, numbers, dots,
      and hyphens only, 3-63 characters.

  IndexDocument:
    Type: String
    Default: index.html
    Description: The file to serve as the website's home page.

  ErrorDocument:
    Type: String
    Default: error.html
    Description: The file to serve when a request results in an error (e.g. 404).

  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Description: CloudFront price class (controls which edge locations are used).

  GitHubOrg:
    Type: String
    Default: ''
    Description: >
      GitHub org or username that owns the deployment repo (e.g. "bdahiya2007").
      Leave blank to skip creating the GitHub Actions deploy role.

  GitHubRepo:
    Type: String
    Default: ''
    Description: >
      GitHub repo name, without the org (e.g. "secure-static-website-aws").
      Leave blank to skip creating the GitHub Actions deploy role.

  GitHubBranch:
    Type: String
    Default: main
    Description: >
      Branch allowed to assume the deploy role via OIDC (matches the
      workflow's trigger branch).

  CreateGitHubOIDCProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Whether to create the token.actions.githubusercontent.com IAM OIDC
      provider. An AWS account can only have one provider per URL, so set
      this to 'false' if a GitHub Actions OIDC provider already exists in
      this account (from another stack/repo) and this stack will just add
      a role that trusts it.

  AlternateDomainNames:
    Type: CommaDelimitedList
    Default: ''
    Description: >
      Custom domain name(s) to serve the site from as CloudFront
      Aliases, e.g. "example.com,www.example.com". Leave blank to use
      only the default *.cloudfront.net domain. Requires
      AcmCertificateArn to also be set; the ACM certificate must cover
      every name listed here.

  AcmCertificateArn:
    Type: String
    Default: ''
    Description: >
      ARN of an ACM certificate, in us-east-1, validated for the
      domain(s) in AlternateDomainNames. Leave blank to use
      CloudFront's default certificate and *.cloudfront.net domain
      only.

  MinimumProtocolVersion:
    Type: String
    Default: TLSv1.2_2021
    Description: >
      Minimum TLS protocol version CloudFront accepts from viewers.
      Only applies when AcmCertificateArn is set — the default
      certificate always uses CloudFront's own minimum.

Conditions:
  ShouldCreateGitHubDeployRole: !And
    - !Not [!Equals [!Ref GitHubOrg, '']]
    - !Not [!Equals [!Ref GitHubRepo, '']]
  ShouldCreateOIDCProvider: !Equals [!Ref CreateGitHubOIDCProvider, 'true']
  HasCustomDomain: !Not [!Equals [!Ref AcmCertificateArn, '']]

Resources:

  CloudFrontBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      # cfn-lint flags this as redundant (W3045) since
      # OwnershipControls: BucketOwnerEnforced below already disables
      # ACLs entirely - but removing it breaks CloudFormation *updates*
      # on an existing bucket: on update, CloudFormation still issues a
      # PutBucketAcl call to reconcile the now-unspecified property,
      # which S3 rejects outright once ACLs are disabled ("The bucket
      # does not allow ACLs"). Keep it; the lint rule is suppressed for
      # this resource in the CI validate job instead.
      AccessControl: Private
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      WebsiteConfiguration:
        IndexDocument: !Ref IndexDocument
        ErrorDocument: !Ref ErrorDocument
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Lets uploaders (deploy.sh, the GitHub Actions workflow) use the
      # bucket's s3-accelerate endpoint, which routes the upload through
      # the nearest CloudFront edge location instead of going directly
      # to the bucket's region - speeds up "aws s3 sync" from locations
      # far from us-east-1. No effect on how CloudFront serves reads;
      # this only accelerates writes to the bucket.
      AccelerateConfiguration:
        AccelerationStatus: Enabled
      # Enables the AWS/S3 per-request metrics (AllRequests, GetRequests,
      # etc.) for the whole bucket, published under FilterId "EntireBucket".
      # These aren't published to CloudWatch by default and carry their own
      # per-metric charge - see the dashboard below.
      MetricsConfigurations:
        - Id: EntireBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  # Dedicated bucket for product images, kept separate from the website
  # bucket so images can be managed (uploaded, versioned, lifecycled)
  # independently of the site's HTML/CSS/JS. Reachable only through
  # CloudFront, via its own OAC — same private-by-default posture as
  # CloudFrontBucket. Object keys are expected to mirror the public URL
  # path (e.g. an object at key "images/products/foo.jpg" is served at
  # "/images/products/foo.jpg"), since no OriginPath is set on this
  # origin below.
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${BucketName}-images'
      # See the comment on CloudFrontBucket's AccessControl property —
      # same reasoning applies here even though this bucket has no
      # WebsiteConfiguration.
      AccessControl: Private
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # See the comment on CloudFrontBucket's AccelerateConfiguration —
      # same rationale, so uploading product images benefits too.
      AccelerateConfiguration:
        AccelerationStatus: Enabled
      # Product images are read far more often right after upload than
      # months later, so ageing them into cheaper storage classes cuts
      # cost. No rule applies to the website bucket — that content is
      # small and changes too often for this to pay off.
      #
      # WARNING: GLACIER (Flexible Retrieval) is not readable via a plain
      # GetObject — S3 returns 403 InvalidObjectState until the object is
      # explicitly restored, a process that takes minutes to hours. Once
      # an image crosses 180 days, the next time CloudFront's cache for
      # it expires and revalidates against this origin, that image will
      # start failing to load on the live site until someone notices and
      # runs a restore. This is a deliberate tradeoff (cost over
      # long-tail availability), not an oversight — if that's not
      # acceptable, switch StorageClass to GLACIER_IR (Glacier Instant
      # Retrieval), which stays transparently readable at a similar
      # price point.
      LifecycleConfiguration:
        Rules:
          - Id: TransitionAgingProductImages
            Status: Enabled
            # Deliberately NOT overriding S3's default 128 KB minimum
            # object size for transitions. Standard-IA/Glacier bill each
            # object at a 128 KB minimum regardless of its actual size,
            # so transitioning anything smaller than that costs MORE
            # than leaving it in Standard, not less. This bucket's
            # current product photos (a few KB to a few dozen KB each)
            # are all under that threshold, so the default correctly
            # skips them today; the rule is here for when larger,
            # higher-resolution images are added later.
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 60
              - StorageClass: GLACIER
                TransitionInDays: 180
      MetricsConfigurations:
        - Id: EntireBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  # Bucket policy grants access only to this specific CloudFront distribution,
  # via Origin Access Control (SigV4-signed requests to the S3 REST endpoint).
  CloudFrontBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudFrontBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${CloudFrontBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${BucketName}-oac'
        Description: OAC for CloudFront to access the S3 static website bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Bucket policy grants access only to this specific CloudFront
  # distribution, via the images bucket's own Origin Access Control.
  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${ImagesBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # Separate OAC for the images bucket/origin, distinct from the one used
  # for the website bucket — each origin gets its own OAC so access can be
  # scoped, audited, and rotated independently.
  ImagesOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${BucketName}-images-oac'
        Description: OAC for CloudFront to access the S3 product images bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # AWS WAF web ACL using the AWS managed SQL injection rule set.
  # Scope: CLOUDFRONT web ACLs are global but must be created in the
  # us-east-1 region — this stack must be deployed there.
  #
  # WAF's Name/MetricName fields only allow word characters and hyphens
  # (no dots), but BucketName may contain dots (e.g. a domain name like
  # "example.com"), so dots are swapped for hyphens here before use.
  CloudFrontWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub
        - '${SanitizedName}-waf'
        - SanitizedName: !Join ['-', !Split ['.', !Ref BucketName]]
      Scope: CLOUDFRONT
      Description: !Sub 'Web ACL for ${BucketName} CloudFront distribution - SQL injection protection'
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${BucketName}-webacl'
      Rules:
        - Name: AWS-AWSManagedRulesSQLiRuleSet
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesSQLiRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${BucketName}-sqli-rule-set'

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'CDN for ${BucketName} static website'
        DefaultRootObject: !Ref IndexDocument
        PriceClass: !Ref PriceClass
        HttpVersion: http2and3
        IPV6Enabled: true
        WebACLId: !GetAtt CloudFrontWebACL.Arn
        Aliases: !If [HasCustomDomain, !Ref AlternateDomainNames, !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: !Ref MinimumProtocolVersion
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: S3CloudFrontOrigin
            # Uses the bucket's REST (regional) domain name, not the S3
            # website endpoint — OAC/SigV4 is only supported against the
            # REST endpoint. S3OriginConfig + OriginAccessControlId is what
            # tells CloudFront to sign requests with OAC.
            DomainName: !GetAtt CloudFrontBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
          - Id: S3ImagesOrigin
            # Same REST/OAC pattern as the website origin above, pointed
            # at the dedicated images bucket.
            DomainName: !GetAtt ImagesBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt ImagesOriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: S3CloudFrontOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS Managed-CachingOptimized
        # Routes any request under /images/* to the dedicated images
        # bucket instead of the website bucket.
        CacheBehaviors:
          - PathPattern: /images/*
            TargetOriginId: S3ImagesOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS Managed-CachingOptimized
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: !Sub '/${ErrorDocument}'
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: !Sub '/${ErrorDocument}'

  # CloudWatch dashboard showing request volume from both the CDN layer
  # (CloudFront) and the origin layer (S3), so a spike in one relative to
  # the other is visible (e.g. cache misses driving up origin load).
  CloudWatchDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub
        - '${SanitizedName}-dashboard'
        - SanitizedName: !Join ['-', !Split ['.', !Ref BucketName]]
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "CloudFront Requests",
                "view": "timeSeries",
                "stacked": false,
                "region": "us-east-1",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [ "AWS/CloudFront", "Requests", "DistributionId", "${CloudFrontDistribution}", "Region", "Global" ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "S3 AllRequests",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [ "AWS/S3", "AllRequests", "BucketName", "${BucketName}", "FilterId", "EntireBucket" ]
                ]
              }
            }
          ]
        }

  # Lets GitHub Actions authenticate to AWS with short-lived, per-run
  # credentials via OIDC instead of long-lived IAM user access keys.
  # Only created when GitHubOrg/GitHubRepo are supplied.
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Trust is scoped to this exact repo and branch via the 'sub' claim, so
  # only workflow runs triggered from GitHubOrg/GitHubRepo on GitHubBranch
  # can assume this role.
  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateGitHubDeployRole
    Properties:
      RoleName: !Sub
        - '${SanitizedName}-github-deploy'
        - SanitizedName: !Join ['-', !Split ['.', !Ref BucketName]]
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOIDCProvider
                - !Ref GitHubOIDCProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                'token.actions.githubusercontent.com:sub':
                  # push to GitHubBranch (the deploy job) and pull_request
                  # events targeting main (the validate job) each get a
                  # differently-shaped 'sub' claim, and GitHub now embeds
                  # immutable owner/repo IDs in it too (e.g.
                  # "repo:org@123/repo@456:pull_request" instead of plain
                  # "repo:org/repo:pull_request"). The '@*' wildcards match
                  # either form so this keeps working if that ID-inclusion
                  # setting ever changes.
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}'
                  - !Sub 'repo:${GitHubOrg}@*/${GitHubRepo}@*:ref:refs/heads/${GitHubBranch}'
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:pull_request'
                  - !Sub 'repo:${GitHubOrg}@*/${GitHubRepo}@*:pull_request'
      Policies:
        - PolicyName: DeployWebsiteToS3AndInvalidateCloudFront
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListAndSyncBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt CloudFrontBucket.Arn
              - Sid: ReadWriteObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${CloudFrontBucket.Arn}/*'
              - Sid: ListAndSyncImagesBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt ImagesBucket.Arn
              - Sid: ReadWriteImageObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${ImagesBucket.Arn}/*'
              - Sid: InvalidateDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

Outputs:
  BucketName:
    Description: Name of the S3 bucket hosting the website
    Value: !Ref CloudFrontBucket

  S3WebsiteEndpointURL:
    Description: >
      Direct S3 website endpoint URL (kept for reference only — this
      endpoint is not publicly accessible since the bucket blocks public
      access; use CloudFrontURL instead).
    Value: !GetAtt CloudFrontBucket.WebsiteURL

  BucketDomainName:
    Description: Regional S3 domain name of the bucket (CloudFront origin)
    Value: !GetAtt CloudFrontBucket.RegionalDomainName

  BucketArn:
    Description: ARN of the S3 bucket
    Value: !GetAtt CloudFrontBucket.Arn

  BucketAccelerateEndpoint:
    Description: >
      S3 Transfer Acceleration endpoint for the website bucket. Use this
      instead of the regular endpoint (e.g. via 'aws s3 sync --endpoint-url'
      or 'aws configure set default.s3.use_accelerate_endpoint true') to
      speed up uploads from locations far from this bucket's region.
    Value: !Sub 'https://${CloudFrontBucket}.s3-accelerate.amazonaws.com'

  ImagesBucketName:
    Description: Name of the S3 bucket storing product images
    Value: !Ref ImagesBucket

  ImagesBucketArn:
    Description: ARN of the S3 product images bucket
    Value: !GetAtt ImagesBucket.Arn

  ImagesBucketDomainName:
    Description: Regional S3 domain name of the images bucket (CloudFront origin)
    Value: !GetAtt ImagesBucket.RegionalDomainName

  ImagesBucketAccelerateEndpoint:
    Description: >
      S3 Transfer Acceleration endpoint for the images bucket. See
      BucketAccelerateEndpoint for usage.
    Value: !Sub 'https://${ImagesBucket}.s3-accelerate.amazonaws.com'

  CloudFrontDistributionId:
    Description: ID of the CloudFront distribution
    Value: !Ref CloudFrontDistribution

  CloudFrontDomainName:
    Description: CloudFront distribution domain name
    Value: !GetAtt CloudFrontDistribution.DomainName

  CloudFrontURL:
    Description: Public URL for the website via CloudFront
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'

  CustomDomainAliases:
    Condition: HasCustomDomain
    Description: >
      Custom domain(s) serving the site (CloudFront Aliases). Point a
      DNS alias/CNAME record at CloudFrontDomainName for each one.
    Value: !Join [', ', !Ref AlternateDomainNames]

  WebACLArn:
    Description: ARN of the WAF web ACL protecting the CloudFront distribution
    Value: !GetAtt CloudFrontWebACL.Arn

  DashboardURL:
    Description: >
      Console URL for the CloudWatch dashboard showing CloudFront and S3
      request metrics.
    Value: !Sub 'https://us-east-1.console.aws.amazon.com/cloudwatch/home?region=us-east-1#dashboards:name=${CloudWatchDashboard}'

  GitHubActionsDeployRoleArn:
    Condition: ShouldCreateGitHubDeployRole
    Description: >
      ARN of the IAM role GitHub Actions assumes via OIDC to deploy the
      site. Set this as the AWS_ROLE_ARN repository variable in GitHub.
    Value: !GetAtt GitHubActionsDeployRole.Arn