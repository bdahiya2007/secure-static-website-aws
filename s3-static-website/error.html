<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      background: #f7f7f8;
      color: #1a1a1a;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .container {
      max-width: 480px;
    }

    h1 {
      font-size: 96px;
      margin: 0;
      line-height: 1;
      font-weight: 700;
      color: #2d2d2d;
    }

    h2 {
      font-size: 22px;
      margin: 16px 0 8px;
      font-weight: 600;
    }

    p {
      font-size: 15px;
      color: #555;
      line-height: 1.5;
      margin: 0 0 28px;
    }

    a.home-link {
      display: inline-block;
      padding: 10px 22px;
      background: #1a1a1a;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      transition: opacity 0.15s ease;
    }

    a.home-link:hover {
      opacity: 0.85;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #121212;
        color: #f0f0f0;
      }
      h1 {
        color: #f0f0f0;
      }
      p {
        color: #a8a8a8;
      }
      a.home-link {
        background: #f0f0f0;
        color: #121212;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>Sorry, the page you're looking for doesn't exist or may have been moved.</p>
    <a class="home-link" href="/">Back to Home</a>
  </div>
</body>
</html>
